name: GitHub stats cards

on:
  schedule:
    # 05:17 UTC daily. Off the :00 mark to avoid the scheduled-run queue.
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/github-stats.yml"]

permissions:
  contents: write

concurrency:
  group: github-stats
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout generated branch
        uses: actions/checkout@v4
        with:
          ref: stats
          fetch-depth: 1

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@v0.12.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: stats
          THEME: github_dark
          EXCLUDE_REPOS: roybipro/roybipro
          AUTO_PUSH: "false"

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake/github-snake.svg
            assets/snake/github-snake-dark.svg?palette=github-dark

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-summary-card-output assets
          git diff --cached --quiet && { echo "No changes."; exit 0; }
          git commit -m "chore: refresh generated stats"
          git push
